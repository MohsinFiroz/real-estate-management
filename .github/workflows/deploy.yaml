name: Deploy to Kubernetes

on:
  push:
    branches:
      - main  # Or any other branch you want to deploy on

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Go environment
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.23.6'

    # Set up kubectl to interact with your Kubernetes cluster
    - name: Set up kubectl
      run: |
        # Install kubectl
        curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.24.0/bin/linux/amd64/kubectl
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    # Create .kube directory and authenticate to OVH Kubernetes cluster
    - name: Authenticate to OVH Kubernetes cluster
      run: |
        mkdir -p $HOME/.kube  # Create .kube directory if it doesn't exist
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config  # Write kubeconfig

    # Set up GitHub authentication using GitHub's token to access the registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}  # GitHub token to access the container registry

    # Create or update namespace
    - name: Create namespace
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: real-estate-prod
          labels:
            name: real-estate-prod
        EOF

    # Create or update GHCR secret
    - name: Apply Kubernetes Secret for GHCR
      run: |
        kubectl delete secret ghcr-secret --namespace=real-estate-prod --ignore-not-found
        kubectl create secret docker-registry ghcr-secret \
          --namespace=real-estate-prod \
          --docker-server=ghcr.io \
          --docker-username=${{ github.actor }} \
          --docker-password=${{ secrets.GITHUB_TOKEN }} \
          --save-config

    # Create or update PostgreSQL secret
    - name: Apply Kubernetes Secret for PostgreSQL
      run: |
        kubectl delete secret db-secret --namespace=real-estate-prod --ignore-not-found
        kubectl create secret generic db-secret \
          --namespace=real-estate-prod \
          --from-literal=DB_HOST="postgresql-service.real-estate-prod.svc.cluster.local" \
          --from-literal=DB_PORT="5432" \
          --from-literal=DB_USER="${{ secrets.DB_USER }}" \
          --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
          --from-literal=DB_SSL_MODE="${{ secrets.DB_SSL_MODE }}" \
          --save-config
    
    - name: Install Helm
      run: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Install NGINX Ingress Controller using Helm
      run: |
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo update
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --namespace ingress-nginx --create-namespace \
          --set controller.ingressClassResource.name=nginx \
          --set controller.service.type=NodePort \
          --set controller.service.nodePorts.http=30080 \
          --set controller.service.nodePorts.https=30443


    - name: Wait for NGINX Ingress Controller to be ready
      run: |
        kubectl wait --namespace ingress-nginx \
          --for=condition=available deployment/ingress-nginx-controller \
          --timeout=120s

    - name: Check NGINX Ingress Controller services
      run: |
        kubectl get svc -n ingress-nginx

    # **Separate Job: Deploy Portainer** (Can manage multiple namespaces)
    - name: Deploy Portainer to Kubernetes
      run: |
        kubectl apply -f deployments/k8s/portainer.yaml
        kubectl rollout status deployment/portainer -n real-estate-prod

    # **Deploy PostgreSQL to Kubernetes**
    - name: Deploy PostgreSQL to Kubernetes
      run: |
        kubectl apply -f deployments/k8s/postgresql.yaml
        kubectl rollout status deployment/postgresql -n real-estate-prod

    # **Build and Push Docker Image**
    - name: Build and Push Docker Image
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="ghcr.io/$REPO_NAME:latest"

        echo "Building image: $IMAGE_NAME"
        docker build -t $IMAGE_NAME .

        echo "Pushing image: $IMAGE_NAME"
        docker push $IMAGE_NAME

    # **Deploy Go Application to Kubernetes**
    - name: Deploy Go Application to Kubernetes
      run: |
        kubectl apply -f deployments/k8s/app.yaml
        kubectl rollout status deployment/real-estate-management -n real-estate-prod
