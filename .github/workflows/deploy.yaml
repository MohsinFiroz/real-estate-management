name: Deploy to Docker Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Go environment
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.23.6'

    # Set up Docker and login to GitHub Container Registry
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build and push Docker image
    - name: Build and Push Docker Image
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="ghcr.io/$REPO_NAME:latest"

        echo "Building image: $IMAGE_NAME"
        docker build -t $IMAGE_NAME .

        echo "Pushing image: $IMAGE_NAME"
        docker push $IMAGE_NAME

    # SSH into the Docker server and deploy the application container
    - name: SSH into Docker server and deploy application container
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DOCKER_SERVER_IP }}
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        script: |
          # Log in to GitHub Container Registry (GHCR)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Convert repo name to lowercase
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Stop and remove existing application container if it exists
          docker stop real-estate-management || true
          docker rm real-estate-management || true

          # Pull the latest image from GHCR
          docker pull ghcr.io/$REPO_NAME:latest

          # Run the application container
          docker run -d \
            --name real-estate-management \
            --restart always \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_SSL_MODE=${{ secrets.DB_SSL_MODE }} \
            -p 8080:8080 \
            ghcr.io/$REPO_NAME:latest


    # Deploy PostgreSQL container with persistence
    - name: Deploy PostgreSQL container
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DOCKER_SERVER_IP }}
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        script: |
          # Pull the latest PostgreSQL image
          docker pull postgres:latest

          # Stop and remove existing PostgreSQL container if it exists
          docker stop postgres-db || true
          docker rm postgres-db || true

          # Create a volume for PostgreSQL data
          docker volume create postgres_data

          # Run PostgreSQL container with volume for persistence
          docker run -d \
            --name postgres-db \
            --restart always \
            -e POSTGRES_USER=${{ secrets.DB_USER }} \
            -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e POSTGRES_DB=${{ secrets.DB_NAME }} \
            -v postgres_data:/var/lib/postgresql/data \
            -p 5432:5432 \
            postgres:latest

    # Deploy Portainer container with persistence
    - name: Deploy Portainer container
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DOCKER_SERVER_IP }}
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        script: |
          # Pull the latest Portainer image
          docker pull portainer/portainer-ce:latest

          # Stop and remove existing Portainer container if it exists
          docker stop portainer || true
          docker rm portainer || true

          # Create a volume for Portainer data
          docker volume create portainer_data

          # Run Portainer container with volume for persistence
          docker run -d \
            --name portainer \
            --restart always \
            -p 9000:9000 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v portainer_data:/data \
            portainer/portainer-ce:latest

    # Set up reverse proxy with Nginx (with SSL certs) for each subdomain
    - name: Set up reverse proxy with Nginx
      run: |
        sshpass -p "${{ secrets.DOCKER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_USER }}@${{ secrets.DOCKER_SERVER_IP }} << EOF
          sudo apt-get update
          sudo apt-get install -y nginx certbot python3-certbot-nginx

          # Configure reverse proxy for the app
          sudo bash -c 'cat > /etc/nginx/sites-available/real-estate-management<< EOL
          server {
              listen 80;
              server_name real-state-management.softcelia.com;

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOL'

          # Configure reverse proxy for PostgreSQL (if needed)
          sudo bash -c 'cat > /etc/nginx/sites-available/postgres-db << EOL
          server {
              listen 80;
              server_name db.softcelia.com;

              location / {
                  proxy_pass http://softcelia:5432;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOL'

          # Configure reverse proxy for Portainer
          sudo bash -c 'cat > /etc/nginx/sites-available/portainer << EOL
          server {
              listen 80;
              server_name portainer.softcelia.com;

              location / {
                  proxy_pass http://localhost:9000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOL'

          sudo ln -s /etc/nginx/sites-available/real-estate-management /etc/nginx/sites-enabled/
          sudo ln -s /etc/nginx/sites-available/postgres-db /etc/nginx/sites-enabled/
          sudo ln -s /etc/nginx/sites-available/portainer /etc/nginx/sites-enabled/

          # Obtain SSL certificate with Certbot
          sudo certbot --nginx -d real-state-management.softcelia.com -d db.softcelia.com -d portainer.softcelia.com --non-interactive --agree-tos --email m7firoz@gmail.com

          # Reload Nginx to apply changes
          sudo systemctl reload nginx
        EOF
