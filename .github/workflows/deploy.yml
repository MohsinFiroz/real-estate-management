name: Deploy to Docker Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23.6'

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_NAME:latest"
          docker build -t $IMAGE_NAME -f Dockerfile .
          docker push $IMAGE_NAME

      - name: Deploy Application
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DOCKER_SERVER_IP }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          script_stop: true
          script: |
            cp deployment/scripts/deploy-app.sh ~/deployment/scripts/
            bash ~/deployment/scripts/deploy-app.sh \
              "${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.actor }}" \
              "${{ github.repository }}" \
              "${{ secrets.DB_HOST }}" \
              "${{ secrets.DB_PORT }}" \
              "${{ secrets.DB_USER }}" \
              "${{ secrets.DB_PASSWORD }}" \
              "${{ secrets.DB_NAME }}" \
              "${{ secrets.DB_SSL_MODE }}"
            rm -f ~/deployment/scripts/deploy-app.sh

      - name: Deploy Database
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DOCKER_SERVER_IP }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          script_stop: true
          script: |
            cp deployment/scripts/deploy-postgres.sh ~/deployment/scripts/
            bash ~/deployment/scripts/deploy-postgres.sh \
              "${{ secrets.DB_USER }}" \
              "${{ secrets.DB_PASSWORD }}" \
              "${{ secrets.DB_NAME }}"
            rm -f ~/deployment/scripts/deploy-postgres.sh

      - name: Deploy Portainer
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DOCKER_SERVER_IP }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          script_stop: true
          script: |
            cp deployment/scripts/deploy-portainer.sh ~/deployment/scripts/
            bash ~/deployment/scripts/deploy-portainer.sh
            rm -f ~/deployment/scripts/deploy-portainer.sh

      - name: Setup Nginx
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DOCKER_SERVER_IP }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          script_stop: true
          script: |
            cp deployment/scripts/setup-nginx.sh ~/deployment/scripts/
            # Copy Nginx configuration files
            sudo cp /deployment/docker/nginx/conf.d/*.conf /etc/nginx/conf.d/
            bash ~/deployment/scripts/setup-nginx.sh
            rm -f ~/deployment/scripts/setup-nginx.sh
