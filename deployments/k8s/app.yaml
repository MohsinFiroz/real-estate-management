apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-estate-management
  namespace: real-estate-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: real-estate-management
  template:
    metadata:
      labels:
        app: real-estate-management
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: real-estate-management
          image: ghcr.io/mohsinfiroz/real-estate-management:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
            - name: DB_SSL_MODE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_SSL_MODE