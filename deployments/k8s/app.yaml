apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-estate-management
  namespace: real-estate-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: real-estate-management
  template:
    metadata:
      labels:
        app: real-estate-management
    spec:
      containers:
        - name: real-estate-management
          image: ghcr.io/your-username/real-estate-management:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
            - name: DB_SSL_MODE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_SSL_MODE

---

apiVersion: v1
kind: Service
metadata:
  name: real-estate-management-service
  namespace: real-estate-prod
spec:
  selector:
    app: real-estate-management
  ports:
    - port: 8080
      targetPort: 8080

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: real-estate-management-ingress
  namespace: real-estate-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: go-app.yourdomain.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: real-estate-management-service
                port:
                  number: 8080
