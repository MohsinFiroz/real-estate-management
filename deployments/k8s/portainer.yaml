apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: real-estate-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      containers:
        - name: portainer
          image: portainer/portainer-ce:latest
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: portainer-data
              mountPath: /data
      volumes:
        - name: portainer-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: real-estate-prod
spec:
  selector:
    app: portainer
  ports:
    - protocol: TCP
      port: 80    # External port
      targetPort: 9000  # Port inside the container
  type: ClusterIP  # Expose the service internally (no LoadBalancer)

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portainer-ingress
  namespace: real-estate-prod
spec:
  rules:
    - host: portainer.softcelia.com  # Expose using your subdomain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portainer
                port:
                  number: 80
